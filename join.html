<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitLine Membership</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Inter',sans-serif;
      background:#0b0b0b;
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .container {
      width:100%;
      max-width:650px;
      background:#111111;
      border:1px solid #222;
      border-radius:24px;
      padding:40px;
      box-shadow:0 0 40px rgba(249,115,22,0.08);
    }

    .logo {
      text-align:center;
      margin-bottom:10px;
      font-size:42px;
      font-weight:800;
      letter-spacing:1px;
    }

    .logo span { color:#f97316; }

    .subtitle {
      text-align:center;
      color:#9ca3af;
      margin-bottom:35px;
      font-size:15px;
    }

    .section-divider {
      grid-column: 1 / -1;
      border-top: 1px solid #222;
      margin: 8px 0;
      padding-top: 16px;
    }

    .section-title {
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: 700;
      color: #f97316;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .form-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .full { grid-column:1 / -1; }

    label {
      display:block;
      margin-bottom:8px;
      font-size:13px;
      color:#9ca3af;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    input, select, textarea {
      width:100%;
      background:#0b0b0b;
      border:1px solid #262626;
      border-radius:14px;
      padding:15px;
      color:white;
      font-size:15px;
      outline:none;
      transition:0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color:#f97316;
      box-shadow:0 0 0 4px rgba(249,115,22,0.12);
    }

    textarea { resize:none; min-height:120px; }

    .fees-summary {
      grid-column: 1 / -1;
      background: #0b0b0b;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 16px 20px;
      display: none;
    }

    .fees-summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 5px 0;
      color: #9ca3af;
    }

    .fees-summary-row.total {
      border-top: 1px solid #333;
      margin-top: 8px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .fees-summary-row.total span:last-child { color: #f97316; }

    .fees-summary-row .paid-amt { color: #4ade80; }
    .fees-summary-row .pending-amt { color: #f87171; }

    button {
      width:100%;
      margin-top:24px;
      border:none;
      background:#f97316;
      color:white;
      padding:16px;
      border-radius:14px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover { background:#ea580c; transform:translateY(-2px); }

    .success, .error {
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      font-size:14px;
      display:none;
    }

    .success {
      background:rgba(34,197,94,0.12);
      border:1px solid rgba(34,197,94,0.4);
      color:#4ade80;
    }

    .error {
      background:rgba(239,68,68,0.12);
      border:1px solid rgba(239,68,68,0.4);
      color:#f87171;
    }

    @media(max-width:700px) {
      .container { padding:25px; }
      .form-grid { grid-template-columns:1fr; }
      .logo { font-size:34px; }
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo">FIT<span>LINE</span></div>
    <div class="subtitle">Official Membership Registration</div>

    <form id="membershipForm">

      <div class="form-grid">

        <!-- PERSONAL INFO -->
        <div class="section-title">Personal Information</div>

        <div>
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="Enter full name" />
        </div>

        <div>
          <label>Phone</label>
          <input type="tel" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required />
        </div>

        <div class="full">
          <label>Email</label>
          <input type="email" name="email" required placeholder="your@email.com" />
        </div>

        <div>
          <label>Your Goal</label>
          <select name="goal" required>
            <option value="">Select Goal</option>
            <option>Fat Loss / Weight Loss</option>
            <option>Muscle Gain</option>
            <option>General Fitness</option>
            <option>Strength Training</option>
          </select>
        </div>

        <div>
          <label>Preferred Plan</label>
          <select name="plan" id="planSelect" required>
            <option value="">Select Plan</option>
            <option value="3 Months — ₹3,999">3 Months — ₹3,999</option>
            <option value="6 Months — ₹5,999">6 Months — ₹5,999</option>
            <option value="12 Months — ₹8,999">12 Months — ₹8,999</option>
          </select>
        </div>

        <!-- FEES SECTION -->
        <div class="section-divider"></div>
        <div class="section-title">Fees Information</div>

        <div>
          <label>Total Fees (₹)</label>
          <input type="number" name="totalFees" id="totalFees" placeholder="Auto-filled from plan" readonly style="opacity:0.6;cursor:not-allowed;" />
        </div>

        <div>
          <label>Fees Paid (₹)</label>
          <input type="number" name="feesPaid" id="feesPaid" placeholder="Amount paid today" min="0" required />
        </div>

        <!-- Live Summary -->
        <div class="fees-summary" id="feesSummary">
          <div class="fees-summary-row">
            <span>Total Fees</span>
            <span id="summaryTotal">₹0</span>
          </div>
          <div class="fees-summary-row">
            <span>Paid Today</span>
            <span class="paid-amt" id="summaryPaid">₹0</span>
          </div>
          <div class="fees-summary-row total">
            <span>Pending Balance</span>
            <span class="pending-amt" id="summaryPending">₹0</span>
          </div>
        </div>

        <!-- MESSAGE -->
        <div class="section-divider"></div>

        <div class="full">
          <label>Message</label>
          <textarea name="message" placeholder="Any medical condition or notes?"></textarea>
        </div>

      </div>

      <button type="submit">Activate Membership →</button>

      <div class="success" id="successMessage">
        ✅ Membership registered successfully. Check your email 💪
      </div>

      <div class="error" id="errorMessage">
        ❌ Something went wrong. Please try again.
      </div>

    </form>

  </div>

  <script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxkptWX67tHfOdRElbOKdOW1FZBYWZBRrX_7qUXSSAQX2QTaCFE_ycYlyBfsGU5_8xqg/exec";

const planPrices = {
  "3 Months — ₹3,999": 3999,
  "6 Months — ₹5,999": 5999,
  "12 Months — ₹8,999": 8999
};

const planSelect     = document.getElementById("planSelect");
const totalFeesEl    = document.getElementById("totalFees");
const feesPaidEl     = document.getElementById("feesPaid");
const feesSummary    = document.getElementById("feesSummary");
const summaryTotal   = document.getElementById("summaryTotal");
const summaryPaid    = document.getElementById("summaryPaid");
const summaryPending = document.getElementById("summaryPending");

function updateSummary() {
  const total   = planPrices[planSelect.value] || 0;
  const paid    = parseInt(feesPaidEl.value)   || 0;
  const pending = Math.max(0, total - paid);

  totalFeesEl.value        = total || "";
  summaryTotal.innerText   = "₹" + total.toLocaleString("en-IN");
  summaryPaid.innerText    = "₹" + paid.toLocaleString("en-IN");
  summaryPending.innerText = "₹" + pending.toLocaleString("en-IN");

  if (total > 0) feesSummary.style.display = "block";
}

planSelect.addEventListener("change", updateSummary);
feesPaidEl.addEventListener("input",  updateSummary);

const form           = document.getElementById("membershipForm");
const submitBtn      = document.querySelector('button[type="submit"]');
const successMessage = document.getElementById("successMessage");
const errorMessage   = document.getElementById("errorMessage");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  successMessage.style.display = "none";
  errorMessage.style.display   = "none";

  const phone = form.phone.value.trim();
  if (!/^[0-9]{10}$/.test(phone)) {
    errorMessage.innerText     = "❌ Please enter valid 10-digit mobile number.";
    errorMessage.style.display = "block";
    return;
  }

  if (!planSelect.value) {
    errorMessage.innerText     = "❌ Please select a plan.";
    errorMessage.style.display = "block";
    return;
  }

  const total   = planPrices[planSelect.value] || 0;
  const paid    = parseInt(feesPaidEl.value)   || 0;
  const pending = Math.max(0, total - paid);

  if (paid > total) {
    errorMessage.innerText     = "❌ Fees paid cannot be more than total fees.";
    errorMessage.style.display = "block";
    return;
  }

  let feesStatus = "Pending";
  if      (paid >= total) feesStatus = "Paid";
  else if (paid > 0)      feesStatus = "Partial";

  submitBtn.disabled  = true;
  submitBtn.innerText = "Processing...";

  // Build URL with all params
  const url = SCRIPT_URL
    + "?type=member"
    + "&name="        + encodeURIComponent(form.name.value.trim())
    + "&phone="       + encodeURIComponent(phone)
    + "&email="       + encodeURIComponent(form.email.value.trim())
    + "&goal="        + encodeURIComponent(form.goal.value)
    + "&plan="        + encodeURIComponent(planSelect.value)
    + "&message="     + encodeURIComponent(form.message.value.trim())
    + "&feesPaid="    + paid
    + "&totalFees="   + total
    + "&feesPending=" + pending
    + "&feesStatus="  + encodeURIComponent(feesStatus);

  try {

    // Use no-cors mode — Apps Script needs this from external sites
    await fetch(url, {
  method: "GET",
  mode:   "no-cors"
});

    // no-cors won't return readable response
    // but if no error thrown, it worked
    successMessage.style.display = "block";
    form.reset();
    feesSummary.style.display    = "none";
    totalFeesEl.value            = "";

  } catch(err) {
    errorMessage.innerText     = "❌ Network error. Please check connection.";
    errorMessage.style.display = "block";
  }

  submitBtn.disabled  = false;
  submitBtn.innerText = "Activate Membership →";
});

</script>
</body>
</html>
