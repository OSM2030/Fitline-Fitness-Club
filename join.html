<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FitLine Membership</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      background:#0b0b0b;

      color:white;

      min-height:100vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:30px;

    }

    .container{

      width:100%;
      max-width:650px;

      background:#111111;

      border:1px solid #222;

      border-radius:24px;

      padding:40px;

      box-shadow:
      0 0 40px rgba(249,115,22,0.08);

    }

    .logo{

      text-align:center;

      margin-bottom:10px;

      font-size:42px;

      font-weight:800;

      letter-spacing:1px;

    }

    .logo span{

      color:#f97316;

    }

    .subtitle{

      text-align:center;

      color:#9ca3af;

      margin-bottom:35px;

      font-size:15px;

    }

    .form-grid{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:18px;

    }

    .full{

      grid-column:1 / -1;

    }

    label{

      display:block;

      margin-bottom:8px;

      font-size:13px;

      color:#9ca3af;

      font-weight:600;

      text-transform:uppercase;

      letter-spacing:1px;

    }

    input,
    select,
    textarea{

      width:100%;

      background:#0b0b0b;

      border:1px solid #262626;

      border-radius:14px;

      padding:15px;

      color:white;

      font-size:15px;

      outline:none;

      transition:0.3s;

    }

    input:focus,
    select:focus,
    textarea:focus{

      border-color:#f97316;

      box-shadow:
      0 0 0 4px rgba(249,115,22,0.12);

    }

    textarea{

      resize:none;

      min-height:120px;

    }

    button{

      width:100%;

      margin-top:24px;

      border:none;

      background:#f97316;

      color:white;

      padding:16px;

      border-radius:14px;

      font-size:16px;

      font-weight:700;

      cursor:pointer;

      transition:0.3s;

    }

    button:hover{

      background:#ea580c;

      transform:translateY(-2px);

    }

    .success,
    .error{

      margin-top:20px;

      padding:15px;

      border-radius:12px;

      font-size:14px;

      display:none;

    }

    .success{

      background:rgba(34,197,94,0.12);

      border:1px solid rgba(34,197,94,0.4);

      color:#4ade80;

    }

    .error{

      background:rgba(239,68,68,0.12);

      border:1px solid rgba(239,68,68,0.4);

      color:#f87171;

    }

    @media(max-width:700px){

      .container{

        padding:25px;

      }

      .form-grid{

        grid-template-columns:1fr;

      }

      .logo{

        font-size:34px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo">
      FIT<span>LINE</span>
    </div>

    <div class="subtitle">
      Official Membership Registration
    </div>

    <form id="membershipForm">

      <div class="form-grid">

        <div>

          <label>Full Name</label>

          <input
            type="text"
            name="name"
            required
            placeholder="Enter full name"
          />

        </div>

        <div>

          <label>Phone</label>

         <input
  type="tel"
  name="phone"
  placeholder="10-digit mobile number"
  pattern="[0-9]{10}"
  maxlength="10"
  required
/>

        </div>

        <div class="full">

          <label>Email</label>

          <input
            type="email"
            name="email"
            required
            placeholder="your@email.com"
          />

        </div>

        <div>

          <label>Your Goal</label>

          <select name="goal" required>

            <option value="">
              Select Goal
            </option>

            <option>
              Fat Loss / Weight Loss
            </option>

            <option>
              Muscle Gain
            </option>

            <option>
              General Fitness
            </option>

            <option>
              Strength Training
            </option>

          </select>

        </div>

        <div>

          <label>Preferred Plan</label>

          <select name="plan" required>

            <option value="">
              Select Plan
            </option>
           
            <option>
              3 Months — ₹3,999
            </option>

            <option>
              6 Months — ₹5,999
            </option>

            <option>
              12 Months — ₹9,999
            </option>

          </select>

        </div>

        <div class="full">

          <label>Message</label>

          <textarea
            name="message"
            placeholder="Any medical condition or notes?"
          ></textarea>

        </div>

      </div>

      <button type="submit">
        Activate Membership →
      </button>

      <div
        class="success"
        id="successMessage"
      >
        ✅ Membership registered successfully.
        Check your email 💪
      </div>

      <div
        class="error"
        id="errorMessage"
      >
        ❌ Something went wrong.
        Please try again.
      </div>

    </form>

  </div>

 <script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxxkptWX67tHfOdRElbOKdOW1FZBYWZBRrX_7qUXSSAQX2QTaCFE_ycYlyBfsGU5_8xqg/exec";

const form =
document.getElementById("membershipForm");

const submitBtn =
document.querySelector(
'button[type="submit"]'
);

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    successMessage.style.display =
      "none";

    errorMessage.style.display =
      "none";

    // Disable button immediately
    submitBtn.disabled = true;

    submitBtn.innerText =
      "Processing...";

    const phone =
      form.phone.value.trim();

    // Phone validation
    if(!/^[0-9]{10}$/.test(phone)){

      errorMessage.innerText =
        "❌ Please enter valid 10-digit mobile number.";

      errorMessage.style.display =
        "block";

      submitBtn.disabled = false;

      submitBtn.innerText =
        "Activate Membership →";

      return;
    }

    const formData =
      new FormData(form);

    formData.append(
      "type",
      "member"
    );

    try{

      const response =
        await fetch(
          SCRIPT_URL,
          {
            method:"POST",
            body:formData
          }
        );

      if(response.ok){

        successMessage.style.display =
          "block";

        form.reset();

      }
      else{

        errorMessage.style.display =
          "block";

      }

    }
    catch(error){

      errorMessage.style.display =
        "block";

    }

    // Enable button again
    submitBtn.disabled = false;

    submitBtn.innerText =
      "Activate Membership →";

  }
);

</script>

  </script>

</body>

</html>
